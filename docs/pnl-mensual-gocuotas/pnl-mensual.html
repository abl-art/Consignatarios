<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PNL Mensual GOcuotas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Estilos según el design system GOcuotas (skill gocuotas-design):
   Poppins 400/500/700 · rosa #EE2A7B · ink #1C263F · cards 8px con una sola sombra · botones pill.
   Solo modo claro: la marca no define paleta oscura. */
:root {
  color-scheme: light;
  --gc-pink: #EE2A7B;
  --gc-pink-hover: #D21E69;
  --gc-pink-50: #FDEAF2;
  --gc-ink: #1C263F;
  --gc-ink-soft: #333C4C;
  --gc-gray-500: #6C757D;
  --gc-gray-400: #828282;
  --gc-surface: #F8F9FA;
  --gc-line: #E9ECEF;
  --gc-white: #FFFFFF;
  --gc-orange: #EF9300;
  --gc-green: #00AA31;
  --gc-red: #EB001B;
  --gc-blue: #00A1DF;
  --gc-violet: #5B19AE;
  --gc-yellow: #FDBC46;
  --gc-bg-info: #E3EBFF;
  --gc-bg-info-soft: #EFF3FF;
  --shadow-card: 3px 3px 3px 0 rgba(209, 213, 223, 0.3);
  --radius-md: 8px;
  --radius-pill: 999999px;

  /* roles del tablero */
  --bg: var(--gc-white);
  --surface: var(--gc-surface);
  --line: var(--gc-line);
  --line-strong: #C3C8D2; /* barras de meses anteriores en gráficos de columnas */
  --text: var(--gc-ink);
  --text-2: var(--gc-ink-soft);
  --text-3: var(--gc-gray-500);
  --accent: var(--gc-pink);
  --pos: var(--gc-blue);      /* aporte positivo al resultado */
  --neg: var(--gc-orange);    /* aporte negativo al resultado */
  --total: var(--gc-pink);    /* totales / resultado */
  --good-text: #00862A;       /* #00AA31 oscurecido lo justo para texto chico legible */
  --bad-text: var(--gc-red);
  /* modelos: color fijo por modelo (sigue a la entidad, no al ranking) */
  --m-cuotas: var(--gc-pink); --m-premium: var(--gc-blue); --m-adelantos: var(--gc-orange);
  --m-celular: var(--gc-green); --m-qr: var(--gc-violet); --m-big: var(--gc-gray-500); --m-tarjetas: var(--gc-yellow);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 124px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 14px; line-height: 1.45; font-weight: 400;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 { margin: 0; font-weight: 700; }
a { color: var(--gc-pink); }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
:focus-visible { outline: 2px solid var(--gc-pink); outline-offset: 2px; }
.bi { line-height: 1; }

/* ---------- barra superior ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 10px 64px; background: var(--gc-white); box-shadow: var(--shadow-card);
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo { display: flex; align-items: center; gap: 6px; text-decoration: none; }
.logo img:first-child { height: 30px; }
.logo img:last-child { height: 14px; }
.brand-sub { color: var(--text-3); font-size: 12px; border-left: 1px solid var(--line); padding-left: 12px; }
.filtros { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.ctl { display: flex; flex-direction: column; gap: 2px; }
.ctl > span { font-size: 12px; font-weight: 500; color: var(--text-3); padding-left: 12px; }
select {
  font: inherit; font-size: 14px; color: var(--text); background-color: var(--gc-surface);
  border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 6px 34px 6px 14px; min-height: 36px;
  appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--gc-pink) 50%), linear-gradient(135deg, var(--gc-pink) 50%, transparent 50%);
  background-position: calc(100% - 19px) 55%, calc(100% - 14px) 55%; background-size: 5px 5px; background-repeat: no-repeat;
}
select:disabled { color: var(--gc-gray-500); cursor: not-allowed; background-image: none; padding-right: 14px; }
.seg { display: inline-flex; background: var(--gc-surface); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 2px; }
.seg button {
  font: inherit; font-size: 14px; font-weight: 500; border: 0; background: transparent; color: var(--text-2);
  padding: 5px 14px; min-height: 30px; border-radius: var(--radius-pill); cursor: pointer; transition: background-color .15s ease, color .15s ease;
}
.seg button[aria-checked="true"] { background: var(--gc-pink); color: var(--gc-white); }
.btn, .btn-present {
  font: inherit; font-size: 14px; font-weight: 500; line-height: 18px;
  border: 1px solid var(--gc-pink); color: var(--gc-pink); background: transparent;
  border-radius: var(--radius-pill); padding: 8px 18px; min-height: 36px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; transition: background-color .15s ease, color .15s ease;
}
.btn:hover, .btn-present:hover { background: var(--gc-pink); color: var(--gc-white); }
.btn:active, .btn-present:active { transform: translateY(1px); }

.secnav {
  position: sticky; top: var(--topbar-h, 64px); z-index: 19; display: flex; gap: 4px; overflow-x: auto;
  padding: 8px 64px; background: var(--gc-white); border-bottom: 1px solid var(--line); scrollbar-width: none;
}
.secnav a {
  flex: none; padding: 5px 14px; border-radius: var(--radius-pill); color: var(--text-2); text-decoration: none; font-weight: 500; font-size: 13px;
  transition: background-color .15s ease, color .15s ease;
}
.secnav a:hover { color: var(--gc-pink); }
.secnav a.on { background: var(--gc-pink-50); color: var(--gc-pink); }

/* ---------- secciones ---------- */
main { max-width: 1440px; margin: 0 auto; padding: 0 64px 96px; }
section { padding: 56px 0 8px; }
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.eyebrow { font-size: 16px; line-height: 20px; font-weight: 400; color: var(--gc-pink); margin-bottom: 4px; }
.sec-head h2 { font-size: 24px; line-height: 28px; }
.sec-head .sub { color: var(--text-3); font-size: 13px; margin-top: 6px; }

.card { background: var(--gc-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-card); padding: 20px 22px; }
.card h3 { font-size: 16px; line-height: 20px; margin-bottom: 12px; }
.card .card-sub { color: var(--text-3); font-size: 12px; margin: -6px 0 14px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-7-5 { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); }
@media (max-width: 900px) { .g2, .g3, .g-7-5 { grid-template-columns: minmax(0, 1fr); } }

.aviso {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  background: var(--gc-bg-info-soft); border-radius: var(--radius-md); padding: 14px 16px; color: var(--text-2); font-size: 13px;
}
.aviso .bi { color: var(--gc-pink); font-size: 16px; }
.vacio { color: var(--text-3); font-size: 13px; }

/* ---------- portada: muro rosa ---------- */
#s-portada {
  background: var(--gc-pink); color: var(--gc-white);
  margin: 0 -64px; padding: 56px 64px 64px;
}
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 40px; align-items: start; }
@media (max-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.hero .eyebrow { color: var(--gc-white); }
.hero-title h1 { font-size: 60px; line-height: 64px; color: var(--gc-white); }
.hero-title p { margin: 12px 0 0; font-size: 16px; line-height: 20px; }
.hero-big { margin-top: 36px; display: grid; gap: 20px; }
.hero-big .v { font-size: 36px; line-height: 42px; font-weight: 700; }
.hero-big .l { font-size: 14px; }
.novedades { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .novedades { grid-template-columns: minmax(0, 1fr); } }
.nov { background: var(--gc-white); color: var(--text); border-radius: var(--radius-md); padding: 16px 18px; box-shadow: var(--shadow-card); }
.nov h4 { font-size: 16px; line-height: 20px; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.nov h4 .bi { color: var(--gc-pink); font-size: 18px; }
.nov p { margin: 0; color: var(--text-2); font-size: 13px; }
#s-portada .aviso { background: var(--gc-white); }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--gc-surface); border-radius: var(--radius-md); padding: 16px 18px; box-shadow: var(--shadow-card); }
.kpi .l { font-size: 13px; color: var(--text-3); font-weight: 500; }
.kpi .v { font-size: 24px; line-height: 28px; font-weight: 700; margin: 4px 0; }
.kpi .d { font-size: 12px; color: var(--text-3); }
.kpi .x { font-size: 12px; color: var(--text-3); margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.kpi.hl { background: var(--gc-pink-50); }
.kpi.hl .v { color: var(--gc-pink); }
.delta { font-weight: 500; font-size: 12px; display: inline-flex; align-items: center; gap: 3px; }
.delta.good { color: var(--good-text); }
.delta.bad { color: var(--bad-text); }
.delta.neu { color: var(--text-3); }

.drivers { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.drivers li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; background: var(--gc-white); border-radius: var(--radius-md); font-size: 13px; }
.drivers li .bi { color: var(--gc-pink); font-size: 16px; margin-top: 1px; flex: none; }

/* ---------- tablas ---------- */
.tabla-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: right; font-weight: 500; font-size: 12px; color: var(--text-3); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td:first-child { white-space: normal; min-width: 180px; }
tr.rubro td { font-weight: 500; cursor: pointer; }
tr.rubro td:first-child::before { content: ""; width: 11px !important; height: 11px; margin-right: 7px; background: var(--gc-pink); -webkit-mask: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMDAwIiBzdHJva2Utd2lkdGg9IjEuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNNiAzLjUgMTAuNSA4IDYgMTIuNSIvPjwvc3ZnPg==") center/contain no-repeat; mask: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMDAwIiBzdHJva2Utd2lkdGg9IjEuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNNiAzLjUgMTAuNSA4IDYgMTIuNSIvPjwvc3ZnPg==") center/contain no-repeat; display: inline-block; width: 18px; color: var(--gc-pink); transition: transform .15s ease; }
tr.rubro.open td:first-child::before { transform: rotate(90deg); }
tr.rubro.fijo td:first-child::before { content: ""; }
tr.rubro:not(.fijo):hover td { color: var(--gc-pink); }
tr.cuenta td { color: var(--text-2); font-size: 12.5px; background: var(--gc-white); }
tr.cuenta td:first-child { padding-left: 36px; }
tr.cuenta.hide { display: none; }
tr.sub td { font-weight: 700; background: var(--gc-bg-info-soft); }
tr.total td { font-weight: 700; font-size: 14px; background: var(--gc-pink-50); color: var(--text); border-bottom: 0; }
tr.pct td { color: var(--text-3); }
tr.clic { cursor: pointer; }
tr.clic:hover td { background: var(--gc-white); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; }
.tabla-nota { color: var(--text-3); font-size: 12px; margin-top: 10px; }
.compacta th, .compacta td { padding: 8px 7px; font-size: 12.5px; }
.compacta td:first-child { min-width: 130px; }

/* ---------- gráficos ---------- */
.chart { width: 100%; overflow: visible; font-family: inherit; }
.scroll-x { overflow-x: auto; }
.chart text { fill: var(--text-2); font-size: 12px; font-family: inherit; }
.chart .lbl-strong { fill: var(--text); font-weight: 500; }
.chart .axis-l { stroke: #D1D5DF; stroke-width: 1; }
.chart .conn { stroke: var(--gc-gray-400); stroke-width: 1; stroke-dasharray: 2 3; }
.chart rect[data-tip]:hover { filter: brightness(.94); }

.hbar { display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; }
.hbar .n { font-size: 13px; font-weight: 500; }
.hbar .n small { display: block; color: var(--text-3); font-size: 11.5px; font-weight: 400; }
.hbar .track { height: 12px; background: var(--gc-white); border-radius: var(--radius-pill); overflow: hidden; }
.hbar .fill { height: 100%; border-radius: var(--radius-pill); background: var(--gc-pink); }
.hbar .v { font-size: 13px; font-weight: 700; text-align: right; }
.hbar .v small { color: var(--text-3); font-weight: 400; margin-left: 6px; }
.hbar .det { grid-column: 1 / -1; color: var(--text-3); font-size: 12px; margin: -2px 0 10px; }

.stack { display: flex; height: 28px; border-radius: var(--radius-pill); overflow: hidden; gap: 2px; margin: 6px 0 12px; background: var(--gc-white); }
.stack div { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--text-2); }
.legend b { color: var(--text); font-weight: 700; }

.tabs { display: inline-flex; gap: 2px; background: var(--gc-surface); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 2px; }
.tabs button { font: inherit; font-size: 13px; font-weight: 500; border: 0; background: transparent; color: var(--text-2); padding: 5px 14px; border-radius: var(--radius-pill); cursor: pointer; }
.tabs button.on { background: var(--gc-pink); color: var(--gc-white); }

.area-list { margin: 0; padding-left: 18px; color: var(--text-2); font-size: 13px; }
.area-list li + li { margin-top: 6px; }
.area-list li::marker { color: var(--gc-pink); }

.tip {
  position: fixed; z-index: 50; pointer-events: none; opacity: 0;
  background: var(--gc-ink); color: var(--gc-white); font-size: 12px; padding: 8px 10px; border-radius: var(--radius-md); max-width: 280px; line-height: 1.4;
}
.tip.on { opacity: 1; }

/* ---------- modo presentación ---------- */
.present-hud { display: none; }
body.present .secnav { display: none; }
body.present section { min-height: calc(100vh - var(--topbar-h, 64px)); }
body.present .present-hud {
  display: block; position: fixed; right: 18px; bottom: 16px; z-index: 30;
  background: var(--gc-ink); color: var(--gc-white); font-size: 12px; padding: 6px 12px; border-radius: var(--radius-pill);
}
body.present .btn-present { background: var(--gc-pink); color: var(--gc-white); }

@media (max-width: 900px) {
  .topbar, .secnav { padding-left: 20px; padding-right: 20px; }
  main { padding: 0 20px 64px; }
  #s-portada { margin: 0 -20px; padding: 40px 20px 48px; }
}
@media (max-width: 640px) {
  .topbar { position: static; }
  .secnav { top: 0; }
  html { scroll-padding-top: 60px; }
  .hero-title h1 { font-size: 36px; line-height: 42px; }
  .hero-big .v { font-size: 28px; line-height: 32px; }
  .kpi .v { font-size: 20px; }
  .hbar { grid-template-columns: minmax(0, 1fr) auto; }
  .hbar .track { grid-column: 1 / -1; grid-row: 2; }
  .brand-sub { display: none; }
}
@media print {
  .topbar, .secnav, .present-hud { display: none; }
  section { break-inside: avoid; page-break-after: always; }
}

/* Interanual y consumo por área */
th.grupo { text-align: center; color: var(--gc-pink); border-bottom: 1px solid var(--line); }
th.sep, td.sep { border-left: 1px solid var(--line); }
.efemerides { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: 13px; line-height: 1.45; }
.efemerides li { display: grid; grid-template-columns: 112px minmax(0, 1fr); column-gap: 10px; }
.efemerides .efe-fecha { grid-row: span 2; font-weight: 500; color: var(--text-3); font-size: 12px; }
.efemerides .efe-mod { font-weight: 500; color: var(--gc-pink); font-size: 12px; }
@media (max-width: 640px) { .efemerides li { grid-template-columns: minmax(0, 1fr); } .efemerides .efe-fecha { grid-row: auto; } }

/* Ajustes (DDJJ Ganancias, Fideicomiso) */
.chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 12px; font-weight: 500; padding: 7px 12px; border-radius: var(--radius-pill); border: 1px solid var(--line); background: var(--gc-surface); color: var(--text-2, inherit); cursor: pointer; white-space: nowrap; }
.chip[aria-checked="true"] { background: var(--gc-pink); border-color: var(--gc-pink); color: var(--gc-white); }
.chip:focus-visible { outline: 2px solid var(--gc-pink); outline-offset: 2px; }
.aviso-aj { margin: 16px 0 0; align-items: flex-start; }
.aviso-aj .link { font: inherit; background: none; border: 0; padding: 0; color: var(--gc-pink); text-decoration: underline; cursor: pointer; }
#ctl-aj[hidden] { display: none !important; }
.kpis.k5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 1100px) { .kpis.k5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) { .kpis.k5 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Novedad destacada (ej. Fideicomiso) a todo el ancho y el resto debajo en tres columnas */
.novedades.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.nov-dest { grid-column: 1 / -1; padding: 20px 22px; }
.nov-dest h4 { font-size: 18px; line-height: 24px; }
.nov-dest > p { font-size: 14px; }
.nov-bloques { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.nov-bloques h5 { font-size: 13px; line-height: 18px; font-weight: 700; color: var(--gc-pink); margin: 0 0 4px; }
.nov-bloques p { margin: 0; color: var(--text-2); font-size: 13px; line-height: 19px; }
@media (max-width: 1100px) { .novedades.n3 { grid-template-columns: minmax(0, 1fr); } .nov-bloques { grid-template-columns: minmax(0, 1fr); } }

.bi{display:inline-block;width:1em;height:1em;background:currentColor;vertical-align:-.125em;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}

<script>
/* PNL mensual — tablero dinámico.
   Datos: data/pnl.json (generado por scripts/actualizar.py desde NetSuite)
          data/contenido/AAAA-MM.json (textos, presupuesto, operaciones — se edita a mano) */
(() => {
  "use strict";

  // ---------- configuración ----------
  const SOCIEDADES = { CONS: "Consolidado GSD + FD", GSD: "GSD — Go Servicios Digitales", FD: "FD — Finanzas Digitales" };
  const MODELOS = ["GO CUOTAS", "GO PREMIUM", "GO ADELANTOS", "GO CELULAR", "GO QR", "GO BIG", "GO TARJETAS"];
  const COLOR_MODELO = { "GO CUOTAS": "--m-cuotas", "GO PREMIUM": "--m-premium", "GO ADELANTOS": "--m-adelantos", "GO CELULAR": "--m-celular", "GO QR": "--m-qr", "GO BIG": "--m-big", "GO TARJETAS": "--m-tarjetas" };
  // Íconos Bootstrap para los comentarios (la marca no usa emojis)
  const ICONO_TIPO = { sube: "bi-graph-up-arrow", baja: "bi-graph-down-arrow", alerta: "bi-exclamation-triangle", ok: "bi-check-circle", info: "bi-info-circle" };
  const GRUPOS = {
    "G:PRESTAMOS": { nombre: "Go Préstamos", modelos: ["GO QR", "GO BIG", "GO PREMIUM", "GO TARJETAS"], nota: "QR + Big + Premium + Tarjeta" },
    "G:ADELANTOS": { nombre: "Go Adelantos", modelos: ["GO ADELANTOS"] },
    "G:CUOTAS":    { nombre: "Go Cuotas + Go Celular", modelos: ["GO CUOTAS", "GO CELULAR"] },
  };
  // Modelos que quedan fuera del "real comparable" contra presupuesto
  const FUERA_PPTO = ["GO CELULAR", "GO TARJETAS", "SIN MODELO"];

  const RUBROS = {
    ventas:     { n: "Ventas", p: ["41"] },
    oi:         { n: "Otros ingresos", p: ["42"] },
    fin:        { n: "Resultados fin. y por tenencia", p: ["43"] },
    compras:    { n: "Compras / servicios", p: ["51"] },
    personal:   { n: "Personal", p: ["52"] },
    marketing:  { n: "Marketing y comercialización", p: ["53"] },
    operativos: { n: "Otros egresos operativos", p: ["54"] },
    impuestos:  { n: "Impuestos y tasas", p: ["55"] },
    financ:     { n: "Financiación", p: ["56"] },
    incob:      { n: "Incobrabilidad", p: ["57"] },
  };
  const SOPORTES = ["53010", "54022", "54023", "54024", "54025", "54026"];

  // ---------- estado ----------
  const S = { pnl: null, base: null, aj: {}, contenido: {}, mes: null, soc: "CONS", modelo: "TODOS", vistaModelos: "modelo" };
  const $ = (s, el = document) => el.querySelector(s);

  // ---------- formato ----------
  const nf0 = new Intl.NumberFormat("es-AR", { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const nf2 = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const M1 = (v) => (v == null ? "—" : `$${nf1.format(v)}M`); // millones con un decimal
  const M = (v) => (v == null || isNaN(v) ? "—" : `${v < -0.5e6 ? "-" : ""}$${nf0.format(Math.abs(v) / 1e6)}M`);
  const Mm = (v) => (v == null ? "—" : `${v < -0.5 ? "-" : ""}$${nf0.format(Math.abs(v))}M`); // ya en millones
  const P = (x, d = 0) => (x == null || !isFinite(x) ? "—" : `${d ? nf1.format(x) : nf0.format(x)}%`);
  const N = (x) => (x == null ? "—" : nf0.format(x));
  const sgn = (x) => (x > 0 ? "+" : "");
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const MESES_N = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const mesNombre = (m, cap = true) => { const [y, mm] = m.split("-"); const t = `${MESES_N[+mm - 1]} ${y}`; return cap ? t[0].toUpperCase() + t.slice(1) : t; };
  const mesAnterior = (m) => { let [y, mm] = m.split("-").map(Number); mm--; if (!mm) { mm = 12; y--; } return `${y}-${String(mm).padStart(2, "0")}`; };

  /** delta con color según efecto en el resultado. cur/prev con signo (ingreso +, gasto -). */
  function delta(cur, prev, { pct = true } = {}) {
    if (prev == null || cur == null) return `<span class="delta neu">sin comparativo</span>`;
    const d = cur - prev;
    const base = Math.abs(prev);
    const vp = base > 0 ? ((Math.abs(cur) - base) / base) * 100 : null;
    const cls = Math.abs(d) < 0.5e6 ? "neu" : d > 0 ? "good" : "bad";
    const arrow = cls === "neu" ? "bi-dash" : Math.abs(cur) >= Math.abs(prev) ? "bi-arrow-up-short" : "bi-arrow-down-short";
    return `<span class="delta ${cls}"><i class="bi ${arrow}"></i>${pct && vp != null ? `${sgn(vp)}${nf0.format(vp)}%` : ""}</span>`;
  }

  // ---------- acceso a datos ----------
  function datosScope(mes, soc = S.soc, modelo = S.modelo) {
    const p = S.pnl;
    if (modelo === "TODOS") return p.sociedades[soc]?.[mes] || null;
    const mm = p.modelos[mes];
    if (!mm || soc !== "CONS") return null;
    const lista = GRUPOS[modelo] ? GRUPOS[modelo].modelos : [modelo];
    return sumar(lista.map((m) => mm[m]).filter(Boolean));
  }
  function sumar(arr) {
    const o = {};
    arr.forEach((d) => Object.entries(d).forEach(([k, v]) => (o[k] = (o[k] || 0) + v)));
    return o;
  }
  const suma = (d, prefijos) => (d ? Object.entries(d).reduce((a, [k, v]) => (prefijos.some((p) => k.startsWith(p)) ? a + v : a), 0) : null);
  function calc(d) {
    if (!d) return null;
    const r = {};
    for (const [k, def] of Object.entries(RUBROS)) r[k] = suma(d, def.p);
    r.ingresos = r.ventas + r.oi + r.fin;
    r.otrosIng = r.oi + r.fin;
    r.grales = r.personal + r.marketing + r.operativos;
    r.impFin = r.impuestos + r.financ;
    r.ebitda = Object.entries(d).reduce((a, [k, v]) => (k === "IG" ? a : a + v), 0);
    r.ig = d.IG || 0;
    r.neto = r.ebitda + r.ig;
    r.rent = r.ingresos ? (r.ebitda / r.ingresos) * 100 : null;
    r.egresos = r.compras + r.grales + r.impFin + r.incob;
    return r;
  }
  const nombreScope = () => {
    if (S.modelo === "TODOS") return SOCIEDADES[S.soc];
    return GRUPOS[S.modelo] ? GRUPOS[S.modelo].nombre : titulo(S.modelo);
  };
  const titulo = (m) => m.replace(/^GO /, "Go ").replace(/\b([A-ZÁÉÍÓÚ])([A-ZÁÉÍÓÚ]+)/g, (_, a, b) => a + b.toLowerCase()).replace("Qr", "QR");

  // ---------- tooltip ----------
  const tip = $("#tip");
  document.addEventListener("mousemove", (e) => {
    const t = e.target.closest?.("[data-tip]");
    if (!t) return tip.classList.remove("on");
    tip.innerHTML = t.getAttribute("data-tip");
    tip.classList.add("on");
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + "px";
    tip.style.top = (e.clientY + 16 + h > innerHeight ? e.clientY - h - 10 : e.clientY + 16) + "px";
  });

  // ---------- gráficos SVG ----------
  /** Ancho real disponible dentro de una card, para que el SVG se dibuje 1:1 y el texto no se achique. */
  function ancho(frac) {
    const main = $("main"), cs = getComputedStyle(main);
    const content = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const f = innerWidth <= 900 ? 1 : frac;
    return Math.max(280, Math.round((f === 1 ? content : (content - 16) * f) - 42));
  }
  /** Waterfall: pasos [{label, v, total?}] con v con signo; los totales se dibujan desde 0. */
  function waterfall(pasos, { h = 280, fmt = M, W = ancho(1) } = {}) {
    W = Math.max(W, 600);
    const padL = 8, padR = 8, top = 24, bot = 46;
    let acc = 0; const barras = [];
    for (const s of pasos) {
      if (s.total) { barras.push({ ...s, y0: 0, y1: s.v }); acc = s.v; }
      else { barras.push({ ...s, y0: acc, y1: acc + s.v }); acc += s.v; }
    }
    const vals = barras.flatMap((b) => [b.y0, b.y1]);
    const max = Math.max(0, ...vals), min = Math.min(0, ...vals);
    const y = (v) => top + ((max - v) / (max - min || 1)) * (h - top - bot);
    const bw = (W - padL - padR) / barras.length;
    const g = barras.map((b, i) => {
      const x = padL + i * bw + bw * 0.16, w = bw * 0.68;
      const yt = y(Math.max(b.y0, b.y1)), yb = y(Math.min(b.y0, b.y1));
      const col = b.total ? "var(--total)" : b.v >= 0 ? "var(--pos)" : "var(--neg)";
      const conn = i < barras.length - 1 ? `<line class="conn" x1="${x + w}" x2="${x + bw}" y1="${y(b.y1)}" y2="${y(b.y1)}"/>` : "";
      const lab = b.total ? fmt(b.v) : `${b.v >= 0 ? "+" : "-"}${fmt(Math.abs(b.v))}`;
      const ly = b.v >= 0 || b.total ? yt - 6 : yb + 13;
      return `<rect x="${x}" y="${yt}" width="${w}" height="${Math.max(1, yb - yt)}" rx="3" fill="${col}" data-tip="<b>${esc(b.label)}</b><br>${lab}"/>
        ${conn}<text x="${x + w / 2}" y="${ly}" text-anchor="middle" class="${b.total ? "lbl-strong" : ""}">${lab}</text>
        ${wrapLabel(b.label, x + w / 2, h - bot + 16, bw)}`;
    }).join("");
    return `<div class="scroll-x"><svg class="chart" viewBox="0 0 ${W} ${h}" style="min-width:${W}px" role="img" aria-label="Gráfico de cascada">
      <line class="axis-l" x1="${padL}" x2="${W - padR}" y1="${y(0)}" y2="${y(0)}"/>${g}</svg></div>`;
  }
  function wrapLabel(t, x, y, bw) {
    const max = Math.max(6, Math.floor(bw / 6.2));
    const words = String(t).split(" "); const lines = [""];
    words.forEach((w) => { if ((lines.at(-1) + " " + w).trim().length > max && lines.at(-1)) lines.push(w); else lines[lines.length - 1] = (lines.at(-1) + " " + w).trim(); });
    return `<text x="${x}" y="${y}" text-anchor="middle">${lines.slice(0, 2).map((l, i) => `<tspan x="${x}" dy="${i ? 13 : 0}">${esc(l)}</tspan>`).join("")}</text>`;
  }
  /** Barras horizontales con eje en cero (admite negativos). */
  function barrasCero(items, { fmt = M, extra, W = ancho(1) } = {}) {
    const angosto = W < 560, rowH = 34, labW = angosto ? 96 : 150, valW = angosto ? 76 : 190, top = 6;
    if (angosto) extra = null;
    const h = top + items.length * rowH + 6;
    const max = Math.max(0, ...items.map((i) => i.v)), min = Math.min(0, ...items.map((i) => i.v));
    const x = (v) => labW + ((v - min) / (max - min || 1)) * (W - labW - valW);
    const g = items.map((it, i) => {
      const yy = top + i * rowH + 8, bh = rowH - 16;
      const x0 = x(Math.min(0, it.v)), x1 = x(Math.max(0, it.v));
      return `<text x="0" y="${yy + bh / 2 + 4}" class="lbl-strong">${esc(it.label)}</text>
        <rect x="${x0}" y="${yy}" width="${Math.max(1.5, x1 - x0)}" height="${bh}" rx="3" fill="${it.v >= 0 ? "var(--pos)" : "var(--neg)"}" data-tip="<b>${esc(it.label)}</b><br>${fmt(it.v)}${it.tip ? "<br>" + it.tip : ""}"/>
        <text x="${W - valW + 10}" y="${yy + bh / 2 + 4}" class="lbl-strong">${fmt(it.v)}</text>
        ${extra ? `<text x="${W - valW + 80}" y="${yy + bh / 2 + 4}">${extra(it)}</text>` : ""}`;
    }).join("");
    return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img"><line class="axis-l" x1="${x(0)}" x2="${x(0)}" y1="0" y2="${h}"/>${g}</svg>`;
  }
  function columnas(items, { fmt = (v) => P(v, 1), h = 200, W = ancho(1) } = {}) {
    const top = 24, bot = 30;
    const max = Math.max(...items.map((i) => i.v)) * 1.1;
    const bw = W / items.length;
    return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${items.map((it, i) => {
      const bh = ((h - top - bot) * it.v) / max, x = i * bw + bw * 0.22, w = bw * 0.56, yy = h - bot - bh;
      return `<rect x="${x}" y="${yy}" width="${w}" height="${bh}" rx="4" fill="${i === items.length - 1 ? "var(--accent)" : "var(--line-strong)"}" data-tip="<b>${esc(it.label)}</b><br>${fmt(it.v)}${it.tip ? "<br>" + it.tip : ""}"/>
        <text x="${x + w / 2}" y="${yy - 7}" text-anchor="middle" class="lbl-strong">${fmt(it.v)}</text>
        <text x="${x + w / 2}" y="${h - bot + 17}" text-anchor="middle">${esc(it.label)}</text>`;
    }).join("")}<line class="axis-l" x1="0" x2="${W}" y1="${h - bot}" y2="${h - bot}"/></svg>`;
  }

  // ---------- secciones ----------
  /** Comentario con ícono: acepta {tipo, texto} o un string (se le quita un emoji inicial si lo tiene). */
  function comentario(c) {
    const o = typeof c === "string" ? { texto: c.replace(/^\p{Extended_Pictographic}\uFE0F?\s*/u, "") } : c;
    return `<li><i class="bi ${ICONO_TIPO[o.tipo] || "bi-dot"}"></i><span>${esc(o.texto)}</span></li>`;
  }
  const aviso = (html) => `<div class="aviso"><i class="bi bi-info-circle"></i><i class="bi bi-info-circle"></i><span>${html}</span></div>`;
  function head(eyebrow, h2, sub, extra = "") {
    return `<div class="sec-head"><div><div class="eyebrow">${eyebrow}</div><h2>${h2}</h2>${sub ? `<div class="sub">${sub}</div>` : ""}</div>${extra}</div>`;
  }
  const subScope = () => `${nombreScope()} · ${mesNombre(S.mes)} · en millones de $ARS`;

  function rPortada(c, r) {
    const icono = (n) => esc(/^bi-/.test(n.icono || "") ? n.icono : "bi-megaphone");
    const novs = c.novedades || [];
    // una novedad "destacada" ocupa todo el ancho y puede tener bloques explicativos; el resto va debajo
    const nov = novs.map((n) => n.destacada
      ? `<div class="nov nov-dest"><h4><i class="bi ${icono(n)}"></i>${esc(n.titulo)}</h4><p>${esc(n.texto)}</p>
          ${(n.bloques || []).length ? `<div class="nov-bloques">${n.bloques.map((b) => `<div><h5>${esc(b.titulo)}</h5><p>${esc(b.texto)}</p></div>`).join("")}</div>` : ""}</div>`
      : `<div class="nov"><h4><i class="bi ${icono(n)}"></i>${esc(n.titulo)}</h4><p>${esc(n.texto)}</p></div>`).join("");
    const conDest = novs.some((n) => n.destacada);
    $("#s-portada").innerHTML = `<div class="hero">
      <div class="hero-title">
        <div class="eyebrow">¿Cómo nos fue en ${mesNombre(S.mes, false).split(" ")[0]}?</div>
        <h1>${esc(c.titulo || "PNL " + mesNombre(S.mes))}</h1>
        <p>${esc(c.equipo || "Equipo de Administración y Finanzas")} · ${esc(nombreScope())}</p>
        <div class="hero-big">
          <div><div class="v num">${M(r?.ebitda)}</div><div class="l">Resultado antes de IG</div></div>
          <div><div class="v num">${P(r?.rent)}</div><div class="l">Rentabilidad s/ ventas + OI</div></div>
          <div><div class="v num">${M(r?.neto)}</div><div class="l">Resultado neto</div></div>
        </div>
      </div>
      <div><div class="eyebrow" style="margin-bottom:12px">Novedades del mes</div>
        ${nov ? `<div class="novedades${conDest ? " n3" : ""}">${nov}</div>` : aviso(`Todavía no hay novedades cargadas para ${mesNombre(S.mes, false)} (data/contenido/${S.mes}.json).`)}
      </div></div>`;
  }

  function rResumen(c, r, rp) {
    if (!r) { $("#s-resumen").innerHTML = head("Resumen", "Resultado del mes", "") + sinDatos(); return; }
    const kpi = (l, cur, prev, x = "", hl = false) => `<div class="kpi ${hl ? "hl" : ""}"><div class="l">${l}</div><div class="v num">${M(cur)}</div>
      <div class="d">${rp ? `vs ${M(prev)} ${mesNombre(mesAnterior(S.mes), false).split(" ")[0]} · ` : ""}${delta(cur, prev)}</div>${x ? `<div class="x">${x}</div>` : ""}</div>`;
    const drivers = (c.drivers?.[S.modelo === "TODOS" ? S.soc : "_"] || []).map(comentario).join("");
    const pasos = [
      { label: "Ventas", v: r.ventas }, { label: "Otros ingresos", v: r.oi }, { label: "Res. financieros", v: r.fin },
      { label: "Compras", v: r.compras }, { label: "Gastos grales.", v: r.grales }, { label: "Impuestos", v: r.impuestos },
      { label: "Financ.", v: r.financ }, { label: "Incobrab.", v: r.incob }, { label: "Res. antes IG", v: r.ebitda, total: true },
    ];
    $("#s-resumen").innerHTML = head("¿Cómo cerró el mes?", `PNL ${esc(nombreScope())}`, subScope()) + `
      <div class="kpis k5">
        ${kpi("Ventas", r.ventas, rp?.ventas)}
        ${kpi("Otros ingresos", r.otrosIng, rp?.otrosIng, `incl. res. financieros ${M(r.fin)}`)}
        ${kpi("Gastos grales. + Compras", r.grales + r.compras, rp && rp.grales + rp.compras, `Grales ${M(-r.grales)} · Compras ${M(-r.compras)}`)}
        ${kpi("Impuestos + Financiación", r.impFin, rp?.impFin, `Imp. ${M(-r.impuestos)} · Financ. ${M(-r.financ)}`)}
        ${kpi("Incobrabilidad", r.incob, rp?.incob)}
      </div>
      <div class="kpis" style="margin-top:16px">
        ${kpi("Resultado antes de IG", r.ebitda, rp?.ebitda, "", true)}
        <div class="kpi hl"><div class="l">Rentabilidad s/ ventas + OI</div><div class="v num">${P(r.rent)}</div>
          <div class="d">${rp ? `vs ${P(rp.rent)} mes anterior` : ""}</div></div>
        ${(() => { // rentabilidad sin el impuesto a los débitos y créditos (cuenta 55006)
          const deb = -(suma(datosScope(S.mes), ["55006"]) || 0);
          if (!deb || !r.ingresos) return "";
          const rs = ((r.ebitda + deb) / r.ingresos) * 100;
          return `<div class="kpi"><div class="l">Rentabilidad sin imp. a los débitos y créditos</div><div class="v num">${P(rs)}</div>
            <div class="d"><span class="delta good">+${nf0.format(Math.round(rs) - Math.round(r.rent))} p.p.</span> vs ${P(r.rent)} con el impuesto</div>
            <div class="x">Impuesto del mes: ${M(-deb)}</div></div>`;
        })()}
        ${kpi("Resultado neto (post IG)", r.neto, rp?.neto, `Imp. a las ganancias ${M(r.ig)}`)}
      </div>
      <div class="grid g-7-5" style="margin-top:16px">
        <div class="card"><h3>Cómo se llega al resultado</h3><div class="card-sub">Aporte de cada rubro al resultado antes de impuesto a las ganancias</div>${waterfall(pasos, { W: ancho(7 / 12) })}</div>
        <div class="card"><h3>Principales drivers</h3>${drivers ? `<ul class="drivers">${drivers}</ul>` : `<div class="vacio">Sin comentarios cargados para esta vista.</div>`}</div>
      </div>`;
  }

  function rPnl(d, dp, r, rp) {
    if (!d) { $("#s-pnl").innerHTML = head("Detalle", "Estado de resultados", "") + sinDatos(); return; }
    const cuentas = S.pnl.cuentas;
    const ing = r.ingresos, ingP = rp?.ingresos;
    const fila = (cls, label, cur, prev, extra = "") => {
      const dv = prev != null ? cur - prev : null;
      return `<tr class="${cls}" ${extra}><td>${label}</td><td class="num">${M(cur)}</td>
        ${dp ? `<td class="num">${M(prev)}</td><td class="num">${dv == null ? "—" : (Math.abs(dv) < 0.5e6 ? "$0M" : (dv > 0 ? "+" : "") + M(dv))}</td><td>${delta(cur, prev)}</td>` : ""}
        <td class="num">${ing ? P((cur / ing) * 100, 1) : "—"}</td></tr>`;
    };
    const bloque = (key) => {
      const def = RUBROS[key];
      const cods = [...new Set([...Object.keys(d), ...Object.keys(dp || {})])].filter((k) => def.p.some((p) => k.startsWith(p))).sort();
      const filas = cods.filter((k) => Math.abs(d[k] || 0) >= 1 || Math.abs(dp?.[k] || 0) >= 1)
        .map((k) => fila(`cuenta hide`, `${k} · ${esc(cuentas[k] || "")}`, d[k] || 0, dp ? dp[k] || 0 : null, `data-g="${key}"`)).join("");
      return fila("rubro", def.n, r[key], rp?.[key], `data-k="${key}"`) + filas;
    };
    const html = `
      ${bloque("ventas")}${bloque("oi")}${bloque("fin")}
      ${fila("sub fijo", "Total ingresos", r.ingresos, rp?.ingresos)}
      ${bloque("compras")}
      ${fila("sub fijo", "Gastos generales", r.grales, rp?.grales)}
      ${bloque("personal")}${bloque("marketing")}${bloque("operativos")}
      ${bloque("impuestos")}${bloque("financ")}${bloque("incob")}
      ${fila("total", "Resultado antes de IG (EBITDA)", r.ebitda, rp?.ebitda)}
      <tr class="pct"><td>Rentabilidad s/ ventas + OI</td><td class="num">${P(r.rent)}</td>${dp ? `<td class="num">${P(rp.rent)}</td><td class="num">${sgn(Math.round(r.rent) - Math.round(rp.rent))}${nf0.format(Math.round(r.rent) - Math.round(rp.rent))} p.p.</td><td></td>` : ""}<td></td></tr>
      ${fila("rubro fijo", "Impuesto a las ganancias", r.ig, rp?.ig)}
      ${fila("total", "Resultado neto", r.neto, rp?.neto)}`;
    const prevN = mesNombre(mesAnterior(S.mes)).split(" ")[0];
    $("#s-pnl").innerHTML = head("¿De dónde sale el número?", "Estado de resultados", subScope() + " · clic en un rubro para abrir las cuentas",
      `<div class="tabs" id="pnl-exp"><button data-a="open">Abrir todo</button><button data-a="close">Cerrar todo</button></div>`) + `
      <div class="card tabla-wrap"><table>
        <thead><tr><th>Cuenta</th><th>${mesNombre(S.mes).split(" ")[0]}</th>${dp ? `<th>${prevN}</th><th>Var $</th><th>Var %</th>` : ""}<th>% s/ ingresos</th></tr></thead>
        <tbody>${html}</tbody></table>
        ${!dp ? `<div class="tabla-nota">No hay datos de ${mesNombre(mesAnterior(S.mes), false)} para esta vista${S.modelo !== "TODOS" ? " (falta el export por modelo de ese mes)" : ""}, por eso no se muestra la comparación.</div>` : ""}
        <div class="tabla-nota">Signos: ingresos en positivo, egresos en negativo. El color de la variación indica si mejora (verde) o empeora (rojo) el resultado.</div>
      </div>`;
    $("#s-pnl tbody").addEventListener("click", (e) => {
      const tr = e.target.closest("tr.rubro:not(.fijo)"); if (!tr) return;
      tr.classList.toggle("open");
      $("#s-pnl").querySelectorAll(`tr[data-g="${tr.dataset.k}"]`).forEach((x) => x.classList.toggle("hide", !tr.classList.contains("open")));
    });
    $("#pnl-exp").addEventListener("click", (e) => {
      const a = e.target.dataset.a; if (!a) return;
      $("#s-pnl").querySelectorAll("tr.rubro:not(.fijo)").forEach((x) => x.classList.toggle("open", a === "open"));
      $("#s-pnl").querySelectorAll("tr.cuenta").forEach((x) => x.classList.toggle("hide", a !== "open"));
    });
  }

  function hbarList(items, total, color = () => "var(--accent)") {
    const max = Math.max(...items.map((i) => Math.abs(i.v)));
    return `<div class="hbar">${items.map((it) => `
      <div class="n">${it.dot ? `<span class="dot" style="background:${it.dot}"></span>` : ""}${esc(it.label)}${it.sub ? `<small>${esc(it.sub)}</small>` : ""}</div>
      <div class="track" data-tip="<b>${esc(it.label)}</b><br>${M(Math.abs(it.v))} · ${P((Math.abs(it.v) / total) * 100, 1)} del total"><div class="fill" style="width:${(Math.abs(it.v) / max) * 100}%;background:${color(it)}"></div></div>
      <div class="v num">${M(Math.abs(it.v))}<small>${P((Math.abs(it.v) / total) * 100)}</small></div>
      ${it.det ? `<div class="det">${it.det}</div>` : ""}`).join("")}</div>`;
  }

  function rIngresos(c, d, r) {
    if (!d) { $("#s-ingresos").innerHTML = head("Ingresos", "Mix de ingresos", "") + sinDatos(); return; }
    const g = (cods) => cods.reduce((a, k) => a + (d[k] || 0), 0);

    const items = [
      { label: "Ventas operativas", v: r.ventas, det: det(Object.keys(d).filter((k) => k.startsWith("41"))) },
      { label: "Fee mora / reprogramación", v: g(["42001", "42002", "42003"]), det: det(["42001", "42002", "42003"]) },
      { label: "Ganancias financieras", v: r.fin, det: det(Object.keys(d).filter((k) => k.startsWith("43"))) },
      { label: "Ingresos extraordinarios", v: g(["42004"]) },
      { label: "Comisiones intercompany", v: g(["42006"]), sub: "se compensa con 54036 en el consolidado" },
    ].filter((i) => Math.abs(i.v) > 0.5e6);
    const esp = (c.analisis_especial || []).map((a) => `
      <div class="card"><div class="eyebrow">Análisis especial</div><h3>${esc(a.titulo)}</h3><div class="card-sub">${esc(a.bajada || "")}</div>
        ${a.serie ? columnas(a.serie.map((s) => ({ label: s.mes, v: s.pct, tip: s.cobrado != null ? `Total cobrado en el mes: ${Mm(s.cobrado)}` : "" })), { W: ancho(5 / 12) }) : ""}
        ${(a.notas || []).length ? `<ul class="area-list" style="margin-top:8px">${a.notas.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
        ${a.fuente ? `<div class="tabla-nota">Fuente: ${esc(a.fuente)}</div>` : ""}
      </div>`).join("");
    $("#s-ingresos").innerHTML = head("¿De dónde vienen los ingresos?", "Mix de ingresos", subScope()) + `
      <div class="grid ${esp ? "g-7-5" : ""}">
        <div class="card"><h3>Composición · total ${M(r.ingresos)}</h3>${hbarList(items, r.ingresos)}</div>
        ${esp}
      </div>`;
  }

  function rGastos(d, r) {
    if (!d) { $("#s-gastos").innerHTML = head("Gastos", "Composición de gastos", "") + sinDatos(); return; }
    const cuentas = S.pnl.cuentas;
    const top = (pref, n = 3) => {
      const tot = Math.abs(suma(d, pref));
      return Object.entries(d).filter(([k]) => pref.some((p) => k.startsWith(p))).sort((a, b) => a[1] - b[1]).slice(0, n)
        .filter(([, v]) => Math.abs(v) > 0.5e6).map(([k, v]) => `${esc(cuentas[k])} ${M(Math.abs(v))} (${P((Math.abs(v) / tot) * 100)})`).join(" · ");
    };
    let incobDet = top(["57"]);
    const mm = S.pnl.modelos[S.mes];
    if (S.soc === "CONS" && S.modelo === "TODOS" && mm) {
      const tot = Math.abs(r.incob);
      incobDet = Object.entries(mm).map(([m, x]) => [m, suma(x, ["57"])]).sort((a, b) => a[1] - b[1]).filter(([, v]) => Math.abs(v) > 0.5e6).slice(0, 4)
        .map(([m, v]) => `${titulo(m)} ${M(Math.abs(v))} (${P((Math.abs(v) / tot) * 100)})`).join(" · ");
    }
    const items = [
      { label: "Incobrabilidad", v: r.incob, det: incobDet },
      { label: "Compras / servicios", v: r.compras, det: top(["51"]) },
      { label: "Impuestos y tasas", v: r.impuestos, det: top(["55"]) },
      { label: "Operativos", v: r.marketing + r.operativos, sub: "estructura, operación y soportes", det: top(["53", "54"]) },
      { label: "Financiación", v: r.financ, det: top(["56"]) },
      { label: "Personal", v: r.personal, sub: "sueldos y cargas sociales", det: top(["52"]) },
    ].filter((i) => Math.abs(i.v) > 0.5e6).sort((a, b) => a.v - b.v);
    const tot = Math.abs(r.egresos);
    $("#s-gastos").innerHTML = head("¿En qué se van los fondos?", "Composición de gastos", `${subScope()} · total egresos (sin IG) ${M(tot)}`) + `
      <div class="card"><h3>Principales gastos por categoría</h3><div class="card-sub">Debajo de cada barra, los ítems que más pesan dentro de la categoría</div>${hbarList(items, tot)}</div>`;
  }

  function rModelos(c) {
    const el = $("#s-modelos");
    const mm = S.pnl.modelos[S.mes];
    const cab = head("¿Qué modelo aporta más?", S.vistaModelos === "modelo" ? "PNL por modelo de negocio" : "PNL agrupado por categoría",
      `Consolidado GSD + FD · ${mesNombre(S.mes)} · en millones de $ARS · clic en una fila para filtrar todo el tablero`,
      `<div class="tabs" id="mod-tabs"><button data-v="modelo" class="${S.vistaModelos === "modelo" ? "on" : ""}">Por modelo</button><button data-v="grupo" class="${S.vistaModelos === "grupo" ? "on" : ""}">Agrupado</button></div>`);
    if (!mm) { el.innerHTML = cab + `<div class="aviso"><i class="bi bi-info-circle"></i>No hay export por modelo para ${mesNombre(S.mes, false)}.</div>`; bindTabs(); return; }
    if (S.soc !== "CONS") { el.innerHTML = cab + `<div class="aviso"><i class="bi bi-info-circle"></i>El export por modelo de NetSuite es consolidado. <button class="btn" data-go-cons>Ver Consolidado</button></div>`; bindTabs(); return; }
    const ops = c.operaciones || {};
    const filas = S.vistaModelos === "modelo"
      ? MODELOS.filter((m) => mm[m]).map((m) => ({ key: m, nombre: titulo(m), dot: `var(${COLOR_MODELO[m]})`, r: calc(mm[m]), ops: ops[m] }))
      : Object.entries(GRUPOS).map(([k, g]) => {
          const o = g.modelos.map((m) => ops[m]).filter(Boolean);
          const opsSum = o.reduce((a, x) => a + (x.ops || 0), 0);
          const tk = o.filter((x) => x.ticket).reduce((a, x) => a + x.ticket * x.ops, 0) / (o.filter((x) => x.ticket).reduce((a, x) => a + x.ops, 0) || 1);
          const prev = o.reduce((a, x) => a + (x.ops_var != null ? x.ops / (1 + x.ops_var / 100) : 0), 0);
          return { key: k, nombre: g.nombre, sub: g.nota, r: calc(sumar(g.modelos.map((m) => mm[m]).filter(Boolean))), ops: o.length ? { ops: opsSum, ops_var: prev ? (opsSum / prev - 1) * 100 : null, ticket: tk || null } : null };
        });
    const tot = calc(sumar(Object.values(mm)));
    // Aporte de cada modelo a la rentabilidad total: EBITDA del modelo / (ventas + otros ingresos + res. financieros) del total.
    // Equivale a la rentabilidad del modelo × su participación en esos ingresos, y la suma da la rentabilidad del total.
    filas.forEach((f) => { f.aporte = tot.ingresos ? (f.r.ebitda / tot.ingresos) * 100 : null; });
    const opsTot = Object.values(ops).reduce((a, x) => a + (x.ops || 0), 0);
    const vr = (x) => (x == null ? "" : ` <span class="delta ${x >= 0 ? "good" : "bad"}">${sgn(x)}${nf1.format(x)}%</span>`);
    const tr = (f, total = false) => `<tr class="${total ? "total" : "clic"}" ${total ? "" : `data-m="${f.key}"`}>
      <td>${f.dot ? `<span class="dot" style="background:${f.dot}"></span>` : ""}${esc(f.nombre)}${f.sub ? `<div class="tabla-nota" style="margin:0">${esc(f.sub)}</div>` : ""}</td>
      <td class="num">${M(f.r.ventas)}</td><td class="num">${M(f.r.otrosIng)}</td><td class="num">${M(f.r.compras)}</td><td class="num">${M(f.r.grales)}</td>
      <td class="num">${M(f.r.impFin)}</td><td class="num">${M(f.r.incob)}</td><td class="num"><b>${M(f.r.ebitda)}</b></td>
      <td class="num">${P(f.r.rent)}</td><td class="num">${total ? `<b>${P(f.r.rent)}</b>` : `${Math.round(f.aporte) || 0}%`}</td><td class="num">${P((f.r.ebitda / tot.ebitda) * 100, 1)}</td>
      <td class="num">${f.ops ? N(f.ops.ops) + vr(f.ops.ops_var) : "—"}</td><td class="num">${f.ops?.ticket ? "$" + N(f.ops.ticket) + vr(f.ops.ticket_var) : "—"}</td></tr>`;
    const incob = MODELOS.filter((m) => mm[m]).map((m) => ({ m, v: Math.abs(suma(mm[m], ["57"])) })).filter((x) => x.v > 0.5e6 * 20).sort((a, b) => b.v - a.v);
    const incobTot = Math.abs(tot.incob);
    el.innerHTML = cab + `
      <div class="card tabla-wrap"><table class="compacta">
        <thead><tr><th>${S.vistaModelos === "modelo" ? "Modelo" : "Categoría"}</th><th>Ventas</th><th>Otros ing.</th><th>Compras</th><th>Gastos grales.</th><th>Imp + Fin</th><th>Incobr.</th><th>EBITDA</th><th>Rent.</th><th title="Cuántos puntos de la rentabilidad total aporta cada modelo">EBITDA ponderado</th><th>% del EBITDA</th><th>Operaciones</th><th>Ticket prom.</th></tr></thead>
        <tbody>${filas.map((f) => tr(f)).join("")}${tr({ nombre: "Total", r: tot, ops: opsTot ? { ops: opsTot } : null }, true)}</tbody></table>
        <div class="tabla-nota">EBITDA = resultado antes de impuesto a las ganancias. EBITDA ponderado = cuántos puntos de la rentabilidad total (${P(tot.rent)}) explica cada ${S.vistaModelos === "modelo" ? "modelo" : "categoría"}: su EBITDA sobre los ingresos totales (ventas + otros ingresos + res. financieros). Operaciones y ticket: variación vs mes anterior.</div>
      </div>
      <div class="grid g-7-5" style="margin-top:16px">
        <div class="card"><h3>EBITDA por ${S.vistaModelos === "modelo" ? "modelo" : "categoría"}</h3><div class="card-sub">Participación sobre el consolidado de ${M(tot.ebitda)} · rentabilidad del consolidado ${P(tot.rent)}</div>
          ${barrasCero(filas.map((f) => ({ label: f.nombre, v: f.r.ebitda, tip: `Rentabilidad ${P(f.r.rent)}` })).sort((a, b) => b.v - a.v), { W: ancho(7 / 12), extra: (it) => `${P((it.v / tot.ebitda) * 100, 1)} del total` })}
        </div>
        <div class="card"><h3>Incobrabilidad por modelo</h3><div class="card-sub">Participación sobre ${M(incobTot)} consolidado</div>
          <div class="stack">${incob.map((x) => `<div style="width:${(x.v / incobTot) * 100}%;background:var(${COLOR_MODELO[x.m]})" data-tip="<b>${titulo(x.m)}</b><br>${M(x.v)} · ${P((x.v / incobTot) * 100, 1)}"></div>`).join("")}</div>
          <div class="legend">${incob.map((x) => `<span><span class="dot" style="background:var(${COLOR_MODELO[x.m]})"></span>${titulo(x.m)} <b>${M(x.v)}</b> · ${P((x.v / incobTot) * 100, 1)}</span>`).join("")}</div>
        </div>
      </div>`;
    bindTabs();
    el.querySelector("tbody").addEventListener("click", (e) => {
      const t = e.target.closest("tr[data-m]"); if (!t) return;
      S.modelo = t.dataset.m; syncFiltros(); render(); location.hash = "#s-resumen";
    });
  }
  function bindTabs() {
    $("#mod-tabs")?.addEventListener("click", (e) => { const v = e.target.dataset.v; if (v) { S.vistaModelos = v; rModelos(S.contenido[S.mes] || {}); } });
    $("[data-go-cons]")?.addEventListener("click", () => { S.soc = "CONS"; syncFiltros(); render(); });
  }

  function rPpto(c) {
    const el = $("#s-ppto");
    const pp = c.presupuesto;
    const mm = S.pnl.modelos[S.mes];
    const cab = head("¿Cómo venimos contra el presupuesto?", "Real vs presupuesto", `Real comparable: Consolidado sin Go Celular ni Go Tarjetas · ${mesNombre(S.mes)} · en millones de $ARS`);
    if (!pp) { el.innerHTML = cab + `<div class="aviso"><i class="bi bi-info-circle"></i>No hay presupuesto cargado para ${mesNombre(S.mes, false)} (sección "presupuesto" en data/contenido/${S.mes}.json).</div>`; return; }
    if (!mm) { el.innerHTML = cab + `<div class="aviso"><i class="bi bi-info-circle"></i>Hace falta el export por modelo para armar el real comparable.</div>`; return; }
    const comp = sumar(Object.entries(mm).filter(([m]) => !FUERA_PPTO.includes(m)).map(([, d]) => d));
    const s = (pref, filtro = () => true) => Object.entries(comp).reduce((a, [k, v]) => (pref.some((p) => k.startsWith(p)) && filtro(k) ? a + v : a), 0) / 1e6;
    const real = {
      ventas: s(["41"]), otros_ingresos: s(["42", "43"]), compras: -s(["51"]),
      gastos_generales: -s(["53", "54"], (k) => !SOPORTES.includes(k)), masa_salarial: -(s(["52"]) + s(SOPORTES)),
      impuestos: -s(["55"]), financiacion: -s(["56"]), incobrabilidad: -s(["57"]), ig: -(comp.IG || 0) / 1e6,
    };
    const R = pp.rubros;
    const ingreso = { ventas: 1, otros_ingresos: 1 };
    const nombres = { ventas: "Ventas", otros_ingresos: "Otros ingresos", compras: "Compras", gastos_generales: "Gastos generales", masa_salarial: "Masa salarial", impuestos: "Impuestos y tasas", financiacion: "Financiación", incobrabilidad: "Incobrabilidad" };
    const eb = (o) => o.ventas + o.otros_ingresos - o.compras - o.gastos_generales - o.masa_salarial - o.impuestos - o.financiacion - o.incobrabilidad;
    const ebR = eb(real), ebP = eb(R);
    const dv = (rv, pv, esIng, conMonto = true) => {
      const d = rv - pv, pc = pv ? (d / Math.abs(pv)) * 100 : null;
      const good = esIng ? d >= 0 : d <= 0;
      return `${conMonto ? `<td class="num">${sgn(d)}${Mm(d)}</td>` : ""}<td><span class="delta ${Math.abs(d) < 0.5 ? "neu" : good ? "good" : "bad"}">${pc == null ? "n/p" : sgn(pc) + nf0.format(pc) + "%"}</span></td>`;
    };
    const filas = Object.keys(nombres).map((k) => `<tr><td>${nombres[k]}</td><td class="num">${ingreso[k] ? "" : "-"}${Mm(real[k])}</td><td class="num">${ingreso[k] ? "" : "-"}${Mm(R[k])}</td>${dv(real[k], R[k], !!ingreso[k])}</tr>`).join("");
    const netoR = ebR - real.ig, netoP = ebP - R.ig;
    const ingR = real.ventas + real.otros_ingresos, ingP = R.ventas + R.otros_ingresos;
    const bridge = [{ label: "EBITDA ppto", v: ebP, total: true },
      ...Object.keys(nombres).map((k) => ({ label: nombres[k], v: ingreso[k] ? real[k] - R[k] : R[k] - real[k] })),
      { label: "EBITDA real", v: ebR, total: true }];
    // por modelo
    const pm = pp.modelos || {};
    const realModelo = (m, pref) => Math.abs(suma(mm[m] || {}, pref)) / 1e6;
    const tablaModelo = (tit, key, pref, esIng) => {
      const ms = Object.keys(pm[key] || {});
      if (!ms.length) return "";
      let tr = 0, tp = 0;
      const rows = ms.map((m) => { const rv = realModelo(m, pref), pv = pm[key][m]; tr += rv; tp += pv;
        return `<tr><td><span class="dot" style="background:var(${COLOR_MODELO[m]})"></span>${titulo(m)}</td><td class="num">${Mm(rv)}</td><td class="num">${Mm(pv)}</td>${dv(rv, pv, esIng, false)}</tr>`; }).join("");
      return `<div class="card tabla-wrap"><h3>${tit}</h3><table><thead><tr><th>Modelo</th><th>Real</th><th>Ppto</th><th>Desv %</th></tr></thead>
        <tbody>${rows}<tr class="sub fijo"><td>Total</td><td class="num">${Mm(tr)}</td><td class="num">${Mm(tp)}</td>${dv(tr, tp, esIng, false)}</tr></tbody></table></div>`;
    };
    const vm = Object.keys(pm.ventas || {});
    const bridgeV = vm.length ? [{ label: "Ventas ppto", v: vm.reduce((a, m) => a + pm.ventas[m], 0), total: true },
      ...vm.map((m) => ({ label: titulo(m), v: realModelo(m, ["41"]) - pm.ventas[m] })),
      { label: "Ventas real", v: vm.reduce((a, m) => a + realModelo(m, ["41"]), 0), total: true }] : null;
    const lect = (pp.lectura || []).map(comentario).join("");
    el.innerHTML = cab + `
      ${S.soc !== "CONS" || S.modelo !== "TODOS" ? `<div class="aviso" style="margin-bottom:12px"><i class="bi bi-info-circle"></i>El presupuesto se compara siempre a nivel consolidado; los filtros de sociedad y modelo no aplican a esta sección.</div>` : ""}
      <div class="card"><h3>Bridge de desvío presupuestario</h3><div class="card-sub">Azul = desvío favorable al resultado · rojo = desfavorable</div>${waterfall(bridge, { fmt: Mm })}</div>
      <div class="grid g3" style="margin-top:16px">
        ${tablaModelo("Ventas", "ventas", ["41"], true)}${tablaModelo("Otros ingresos", "otros_ingresos", ["42", "43"], true)}${tablaModelo("Incobrabilidad", "incobrabilidad", ["57"], false)}
      </div>
      `;
  }

  function rEspeciales(c) {
    const lista = c.analisis_especial || [];
    const tarjeta = (a) => {
      let serie = "";
      if (a.tipo === "cuenta") {
        // se calcula con los datos del tablero: sociedad/modelo elegidos y ajustes aplicados
        const meses = S.pnl.meses.filter((m) => m <= S.mes).slice(-3);
        serie = columnas(meses.map((m) => {
          const d = datosScope(m), v = -(suma(d, a.cuentas) || 0) / 1e6, r = d ? calc(d) : null;
          return { label: mesNombre(m, false).replace(/^./, (x) => x.toUpperCase()).slice(0, 3) + " " + m.slice(0, 4), v, tip: r && r.ingresos ? `${P((v * 1e6 / r.ingresos) * 100, 1)} de los ingresos` : "" };
        }), { W: ancho(1 / 2), fmt: Mm });
      } else if (a.serie) {
        serie = columnas(a.serie.map((x) => ({ label: x.mes, v: x.pct, tip: x.cobrado != null ? `Total cobrado en el mes: ${Mm(x.cobrado)}` : "" })), { W: ancho(1 / 2) });
      }
      return `<div class="card"><div class="eyebrow">Análisis especial</div><h3>${esc(a.titulo)}</h3><div class="card-sub">${esc(a.bajada || "")}</div>
        ${serie}
        ${(a.notas || []).length ? `<ul class="area-list" style="margin-top:8px">${a.notas.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
        ${a.fuente ? `<div class="tabla-nota">Fuente: ${esc(a.fuente)}</div>` : ""}
      </div>`;
    };
    $("#s-especiales").innerHTML = head("¿Qué miramos en detalle?", "Análisis especiales", mesNombre(S.mes)) +
      (lista.length ? `<div class="grid g2">${lista.map(tarjeta).join("")}</div>` : `<div class="aviso"><i class="bi bi-info-circle"></i>Sin análisis especiales para este mes.</div>`);
  }

  function rInteranual(c) {
    const el = $("#s-interanual");
    const ia = c.interanual;
    const mA = ia ? mesNombre(ia.mes_anterior) : "";
    const cab = head("¿Cómo venimos contra el año pasado?", "Interanual", ia ? `Consolidado · ${mesNombre(S.mes)} vs ${mA} (ajustado por IPC ${nf0.format(ia.ipc)}%) · en millones de $ARS` : mesNombre(S.mes));
    if (!ia) { el.innerHTML = cab + `<div class="aviso"><i class="bi bi-info-circle"></i>No hay comparativo interanual cargado para ${mesNombre(S.mes, false)} (scripts/interanual.py).</div>`; return; }
    const delta = (pc, ing) => {
      if (pc == null) return `<td></td>`;
      const good = ing ? pc >= 0 : pc <= 0;
      return `<td><span class="delta ${Math.abs(pc) < 0.5 ? "neu" : good ? "good" : "bad"}">${sgn(pc)}${nf1.format(pc)}%</span></td>`;
    };
    const hayP = false; // el presupuesto se ve en su propia sección
    // columna del mes actual: se recalcula con los ajustes elegidos (el año anterior viene fijo)
    const act = S.pnl.sociedades.CONS?.[S.mes] || {};
    const pre = { ventas: ["41"], otros_ingresos: ["42", "43"], compras: ["51"], gastos_op: ["52", "53", "54"], impuestos: ["55"], financiacion: ["56"], incobrabilidad: ["57"] };
    const v = {};
    for (const [k, p] of Object.entries(pre)) v[k] = suma(act, p) / 1e6;
    v.ebitda = Object.entries(act).reduce((a, [k, x]) => (k === "IG" ? a : a + x), 0) / 1e6;
    v.ig = (act.IG || 0) / 1e6; v.neto = v.ebitda + v.ig;
    const varAbs = (x, b) => (b ? ((Math.abs(x) - Math.abs(b)) / Math.abs(b)) * 100 : null);
    ia.filas.forEach((f) => { if (f.clave in v) { f.act = v[f.clave]; f.var_nominal = varAbs(f.act, f.ant); f.var_real = varAbs(f.act, f.ant_ipc); } });
    ia.rentabilidad.act = (v.ebitda / (v.ventas + v.otros_ingresos)) * 100;
    const filas = ia.filas.map((f) => `<tr class="${f.total ? "total" : ""}"><td>${esc(f.nombre)}</td>
      <td class="num">${Mm(f.ant)}</td><td class="num">${Mm(f.ant_ipc)}</td><td class="num">${Mm(f.act)}</td>${delta(f.var_nominal, f.ingreso)}${delta(f.var_real, f.ingreso)}
      ${hayP ? `<td class="num sep">${Mm(f.comp)}</td><td class="num">${Mm(f.ppto)}</td>${delta(f.var_ppto, f.ingreso)}` : ""}</tr>`).join("");
    const R = ia.rentabilidad;
    const conc = (ia.conclusiones || []).map(comentario).join("");
    const op = ia.operaciones;
    const n0 = (v) => (v == null ? "—" : nf0.format(v));
    const corto = (m) => mesNombre(m).slice(0, 3) + " " + m.slice(0, 4);
    const opsIA = op ? `<div class="card tabla-wrap"><h3>Operaciones por modelo</h3><table>
      <thead><tr><th>Modelo</th><th>${corto(ia.mes_anterior)}</th><th>${corto(S.mes)}</th><th>Var.</th></tr></thead>
      <tbody>${op.filas.map((f) => { const tot = f.modelo === "TOTAL";
        return `<tr class="${tot ? "total" : ""}"><td>${tot ? "Total" : titulo(f.modelo)}</td><td class="num">${n0(f.ant)}</td><td class="num">${n0(f.act)}</td>
        <td>${f.var == null ? `<span class="delta neu">nuevo</span>` : `<span class="delta ${f.var >= 0 ? "good" : "bad"}">${sgn(f.var)}${nf1.format(f.var)}%</span>`}</td></tr>`; }).join("")}</tbody></table>
      <div class="tabla-nota">Go Celular = operaciones de Go Cuotas en 9 cuotas.</div></div>` : "";
    const efe = (ia.efemerides || []).map((e) => `<li><span class="efe-fecha">${esc(e.fecha)}</span><span class="efe-mod">${titulo(e.modelo)}</span>${esc(e.texto)}</li>`).join("");
    el.innerHTML = cab + `
      <div class="card tabla-wrap"><h3>Estado de resultados comparado</h3><table>
        <thead><tr><th rowspan="2">Rubro</th><th colspan="5" class="grupo">${mesNombre(S.mes)} vs ${mA}</th>${hayP ? `<th colspan="3" class="grupo sep">vs presupuesto (real comparable)</th>` : ""}</tr>
          <tr><th>${mA}</th><th>${mA} + IPC</th><th>${mesNombre(S.mes)}</th><th>Var. nominal</th><th>Var. real</th>${hayP ? `<th class="sep">Real comp.</th><th>Ppto</th><th>Desvío</th>` : ""}</tr></thead>
        <tbody>${filas}
          <tr class="pct"><td>Rentabilidad s/ ventas + OI</td><td class="num">${P(R.ant)}</td><td></td><td class="num">${P(R.act)}</td><td></td><td></td>${hayP ? `<td class="num sep">${P(R.comp)}</td><td class="num">${P(R.ppto)}</td><td></td>` : ""}</tr>
        </tbody></table>
        <div class="tabla-nota">Var. nominal = vs ${mA}. Var. real = vs ${mA} ajustado por IPC ${nf0.format(ia.ipc)}%. En egresos, una variación positiva indica más gasto. ${esc(ia.fuente)}</div></div>
      <div class="grid ${efe || opsIA ? "g-7-5" : ""}" style="margin-top:16px">
        <div class="card"><h3>Conclusiones</h3>${conc ? `<ul class="drivers">${conc}</ul>` : `<div class="vacio">Sin conclusiones cargadas.</div>`}</div>
        ${opsIA}
        ${efe ? `<div class="card"><h3>Efemérides entre ${mA} y ${mesNombre(S.mes)}</h3><ul class="efemerides">${efe}</ul><div class="tabla-nota">Fuente: GO | Efemérides.</div></div>` : ""}
      </div>`;
  }

  function rAreas(c) {
    const a = c.areas || [];
    const ca = c.consumo_areas;
    const tablaCons = (bl, tit) => `<div class="card tabla-wrap"><h3>${esc(tit)}</h3><table>
      <thead><tr><th>Área</th><th>Presupuesto</th><th>Gasto real</th><th>Desvío</th></tr></thead>
      <tbody>${bl.areas.map((x) => `<tr><td>${esc(x.area)}</td><td class="num">${M1(x.ppto)}</td><td class="num">${M1(x.real)}</td><td><span class="delta ${Math.abs(x.desvio) < 0.5 ? "neu" : x.desvio <= 0 ? "good" : "bad"}">${sgn(x.desvio)}${nf2.format(x.desvio)}%</span></td></tr>`).join("")}
        <tr class="total"><td>Total</td><td class="num">${M1(bl.total.ppto)}</td><td class="num">${M1(bl.total.real)}</td><td><span class="delta ${bl.total.desvio <= 0 ? "good" : "bad"}">${sgn(bl.total.desvio)}${nf2.format(bl.total.desvio)}%</span></td></tr>
      </tbody></table></div>`;
    const consumo = ca ? `<div class="grid g2" style="margin-bottom:16px">${tablaCons(ca.mes, "Consumo por área vs presupuesto · " + mesNombre(S.mes))}${tablaCons(ca.acumulado, ca.acumulado.titulo)}</div>
      ${ca.nota ? `<div class="aviso" style="margin-bottom:16px"><i class="bi bi-info-circle"></i>${esc(ca.nota)} <span class="tabla-nota">${esc(ca.fuente)}</span></div>` : ""}` : "";
    $("#s-areas").innerHTML = head("¿Qué pasó en cada área?", "Áreas: consumo y novedades", mesNombre(S.mes)) + consumo + (a.length ? `<div class="grid g2">${a.map((x) => `
      <div class="card"><h3>${esc(x.titulo)}</h3>
        ${x.items?.length ? `<ul class="area-list">${x.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>` : `<div class="vacio">Sin novedades cargadas.</div>`}
        ${x.link ? `<p style="margin:12px 0 0"><a href="${esc(x.link.url)}" target="_blank" rel="noopener">${esc(x.link.texto)} <i class="bi bi-box-arrow-up-right"></i></a></p>` : ""}
      </div>`).join("")}</div>` : `<div class="aviso"><i class="bi bi-info-circle"></i>Sin novedades por área para este mes.</div>`);
  }

  const sinDatos = () => `<div class="aviso"><i class="bi bi-info-circle"></i>No hay datos para esta combinación (${esc(nombreScope())}, ${mesNombre(S.mes, false)}).${S.modelo !== "TODOS" ? " Probá con Modelo = Todos." : ""}</div>`;


  // ---------- ajustes (DDJJ Ganancias, Fideicomiso) ----------
  // S.base = datos tal como vienen de NetSuite; S.pnl = datos con los ajustes elegidos.
  // El IG de NetSuite es la tasa (35%) sobre el resultado antes de IG: se recalcula con la misma tasa.
  const ajustesMes = (mes) => (S.base.ajustes || {})[mes] || [];
  const incluido = (aj) => (aj.id in S.aj ? S.aj[aj.id] : aj.incluido);
  function aplicarAjustes() {
    const p = JSON.parse(JSON.stringify(S.base));
    const res = (d) => Object.entries(d).reduce((a, [k, v]) => (k === "IG" ? a : a + v), 0);
    for (const [mes, lista] of Object.entries(p.ajustes || {})) {
      for (const aj of lista) {
        if (incluido(aj)) continue;
        const destinos = [...Object.entries(aj.sociedades).map(([s, c]) => [p.sociedades[s]?.[mes], c]),
          ...Object.entries(aj.modelos || {}).map(([m, c]) => [p.modelos[mes]?.[m], c])];
        for (const [d, cuentas] of destinos) {
          if (!d) continue;
          const antes = res(d);
          for (const [cod, imp] of Object.entries(cuentas)) d[cod] = (d[cod] || 0) - imp;
          if ("IG" in d && antes) d.IG = (d.IG * res(d)) / antes;
        }
      }
    }
    S.pnl = p;
  }
  function syncAjustes() {
    const lista = ajustesMes(S.mes);
    $("#ctl-aj").hidden = !lista.length;
    $("#f-aj").innerHTML = lista.map((aj) => `<button class="chip" data-id="${esc(aj.id)}" role="switch" aria-checked="${incluido(aj)}" title="${esc(aj.nombre)} (${esc(aj.detalle)}) · ${incluido(aj) ? "incluido: clic para sacarlo" : "excluido: clic para sumarlo"}">${incluido(aj) ? "Con" : "Sin"} ${esc(aj.corto || aj.nombre)}</button>`).join("");
    const distintos = lista.filter((aj) => incluido(aj) !== aj.incluido);
    $("#aviso-aj").innerHTML = distintos.length ? `<div class="aviso aviso-aj"><i class="bi bi-exclamation-triangle"></i><div>Estás viendo una vista distinta a la estándar: ${distintos.map((aj) => `${incluido(aj) ? "con" : "sin"} ${esc(aj.nombre)}`).join(" y ")}. Los números se recalculan, pero los comentarios (drivers, lectura del presupuesto y conclusiones) están escritos para la vista estándar. <button class="link" id="aj-reset">Volver a la vista estándar</button></div></div>` : "";
    const r = $("#aj-reset");
    if (r) r.onclick = () => { S.aj = {}; aplicarAjustes(); syncAjustes(); render(); };
  }

  // ---------- render ----------
  function render() {
    const c = S.contenido[S.mes] || {};
    const d = datosScope(S.mes), dp = datosScope(mesAnterior(S.mes));
    const r = calc(d), rp = calc(dp);
    rPortada(c, r); rResumen(c, r, rp); rPnl(d, dp, r, rp); rInteranual(c); rModelos(c); rPpto(c); rAreas(c);
    document.title = `${c.titulo || "PNL " + mesNombre(S.mes)} · Go Cuotas`;
    const q = { mes: S.mes, soc: S.soc, modelo: S.modelo };
    for (const [id, v] of Object.entries(S.aj)) q["aj_" + id] = v ? "1" : "0";
    try { history.replaceState(null, "", `?${new URLSearchParams(q)}${location.hash}`); } catch { /* visor sin URL propia */ }
  }

  function syncFiltros() {
    $("#f-mes").value = S.mes;
    document.querySelectorAll("#f-soc button").forEach((b) => b.setAttribute("aria-checked", b.dataset.v === S.soc));
    const sel = $("#f-modelo");
    const mm = S.pnl.modelos[S.mes];
    const hay = S.soc === "CONS" && !!mm;
    sel.innerHTML = `<option value="TODOS">Todos</option>` + (hay ? `<optgroup label="Modelos">${MODELOS.filter((m) => mm[m]).map((m) => `<option value="${m}">${titulo(m)}</option>`).join("")}</optgroup>
      <optgroup label="Agrupados">${Object.entries(GRUPOS).map(([k, g]) => `<option value="${k}">${g.nombre}</option>`).join("")}</optgroup>` : "");
    if (!hay) S.modelo = "TODOS";
    sel.value = S.modelo; sel.disabled = !hay;
    sel.title = hay ? "" : S.soc !== "CONS" ? "El export por modelo es consolidado" : "No hay export por modelo para este mes";
  }

  async function cargarContenido(mes) {
    if (S.contenido[mes] !== undefined) return;
    if (window.__CONTENIDO__) { S.contenido[mes] = window.__CONTENIDO__[mes] || {}; return; }
    try { const r = await fetch(`data/contenido/${mes}.json`, { cache: "no-cache" }); S.contenido[mes] = r.ok ? await r.json() : {}; }
    catch { S.contenido[mes] = {}; }
  }

  // ---------- navegación y modo presentación ----------
  function armarNav() {
    const secs = [...document.querySelectorAll("main > section")];
    $("#secnav").innerHTML = secs.map((s) => `<a href="#${s.id}">${s.dataset.nav}</a>`).join("");
    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) {
        document.querySelectorAll("#secnav a").forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
        const i = secs.indexOf(e.target);
        $("#hud").textContent = `${i + 1} / ${secs.length} · ${e.target.dataset.nav} · ← → para navegar · Esc para salir`;
      }
    }), { rootMargin: "-45% 0px -50% 0px" });
    secs.forEach((s) => io.observe(s));
    const actual = () => { const y = innerHeight * 0.4; return Math.max(0, secs.findIndex((s) => s.getBoundingClientRect().bottom > y)); };
    let cur = 0;
    const ir = (i) => { cur = Math.max(0, Math.min(secs.length - 1, i)); secs[cur].scrollIntoView({ behavior: "smooth" }); };
    const toggle = (on = !document.body.classList.contains("present")) => {
      document.body.classList.toggle("present", on);
      $("#btn-present").innerHTML = on ? `<i class="bi bi-x-lg"></i>Salir` : `<i class="bi bi-play-fill"></i>Presentar`;
      render();
      if (on) { document.documentElement.requestFullscreen?.().catch(() => {}); ir(actual()); }
      else if (document.fullscreenElement) document.exitFullscreen?.();
    };
    $("#btn-present").addEventListener("click", () => toggle());
    document.addEventListener("keydown", (e) => {
      if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.key === "p" || e.key === "P") toggle();
      if (!document.body.classList.contains("present")) return;
      if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); ir(cur + 1); }
      if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); ir(cur - 1); }
      if (e.key === "Escape") toggle(false);
    });
    document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("present")) toggle(false); });
  }

  async function init() {
    try {
      S.base = window.__PNL__ || (await (await fetch("data/pnl.json", { cache: "no-cache" })).json());
    } catch (e) {
      $("#app").innerHTML = `<div class="aviso"><i class="bi bi-info-circle"></i>No se pudo cargar data/pnl.json. Si estás abriendo el archivo directo desde la carpeta, levantalo con un servidor (ver LEEME.md).</div>`;
      return;
    }
    const q = new URLSearchParams(location.search);
    for (const [k, v] of q) if (k.startsWith("aj_")) S.aj[k.slice(3)] = v === "1";
    aplicarAjustes();
    const meses = S.pnl.meses;
    S.mes = meses.includes(q.get("mes")) ? q.get("mes") : [...meses].reverse().find((m) => S.pnl.modelos[m]) || meses.at(-1);
    S.soc = SOCIEDADES[q.get("soc")] ? q.get("soc") : "CONS";
    S.modelo = q.get("modelo") || "TODOS";
    $("#f-mes").innerHTML = [...meses].reverse().map((m) => `<option value="${m}">${mesNombre(m)}</option>`).join("");
    await Promise.all(meses.map(cargarContenido));
    syncFiltros(); syncAjustes();
    $("#f-mes").addEventListener("change", (e) => { S.mes = e.target.value; syncFiltros(); syncAjustes(); render(); });
    $("#f-aj").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-id]");
      if (!b) return;
      const aj = ajustesMes(S.mes).find((x) => x.id === b.dataset.id);
      S.aj[aj.id] = !incluido(aj);
      if (S.aj[aj.id] === aj.incluido) delete S.aj[aj.id];
      aplicarAjustes(); syncFiltros(); syncAjustes(); render();
    });
    $("#f-soc").addEventListener("click", (e) => { const v = e.target.dataset.v; if (v) { S.soc = v; syncFiltros(); render(); } });
    $("#f-modelo").addEventListener("change", (e) => { S.modelo = e.target.value; render(); });
    armarNav();
    const altoBarra = () => document.documentElement.style.setProperty("--topbar-h", $(".topbar").offsetHeight + "px");
    altoBarra();
    let t; addEventListener("resize", () => { altoBarra(); clearTimeout(t); t = setTimeout(render, 150); });
    render();
  }
  init();
})();

</script>

</body></html>
